name: Frontend import-boundary check

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/eslint*.js"
      - "frontend/package.json"
      - ".github/workflows/frontend-architecture-boundaries.yml"
  push:
    paths:
      - "frontend/src/**"
      - "frontend/eslint*.js"
      - "frontend/package.json"
      - ".github/workflows/frontend-architecture-boundaries.yml"

permissions:
  contents: read

jobs:
  frontend-architecture-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run import-boundary check (R38)
        run: npm run lint:architecture
