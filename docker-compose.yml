name: medicalassistant

services:
  postgres-app:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: MedicalAssistantDb
      POSTGRES_USER: medicalassistant
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:-medicalassistant-local}
    ports:
      - "5432:5432"
    volumes:
      - medicalassistant_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalassistant -d MedicalAssistantDb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-clinical:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_med
      POSTGRES_USER: clinicalknowledge
      POSTGRES_PASSWORD: ${POSTGRES_CLINICAL_PASSWORD:-clinicalknowledge-local}
    ports:
      - "5433:5432"
    volumes:
      - medicalassistant_clinical_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicalknowledge -d ai_med"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_BOOTSTRAP_USER:-medicalassistant-broker-bootstrap}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_BOOTSTRAP_PASSWORD:-medicalassistant-local-bootstrap}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - medicalassistant_rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rabbitmq-provisioner:
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_BOOTSTRAP_USER: ${RABBITMQ_BOOTSTRAP_USER:-medicalassistant-broker-bootstrap}
      RABBITMQ_BOOTSTRAP_PASSWORD: ${RABBITMQ_BOOTSTRAP_PASSWORD:-medicalassistant-local-bootstrap}
      RABBITMQ_BACKEND_PASSWORD: ${RABBITMQ_BACKEND_PASSWORD:-backend-rabbitmq-local}
      RABBITMQ_WORKER_PASSWORD: ${RABBITMQ_WORKER_PASSWORD:-worker-rabbitmq-local}
    command:
      - sh
      - -ec
      - |
        api="http://rabbitmq:15672/api"
        auth="$${RABBITMQ_BOOTSTRAP_USER}:$${RABBITMQ_BOOTSTRAP_PASSWORD}"
        # The broker healthcheck (node ping) can pass before the management HTTP
        # listener on 15672 accepts connections. Wait for the API to answer so we
        # do not fail with a connection error (curl exit 7).
        echo "waiting for rabbitmq management api..."
        until curl --fail --silent --show-error -u "$$auth" "$$api/overview" >/dev/null 2>&1; do
          sleep 2
        done
        put_user() {
          curl --fail --silent --show-error -u "$$auth" \
            -H "content-type: application/json" \
            -X PUT "$$api/users/$$1" \
            --data-raw "{\"password\":\"$$2\",\"tags\":\"\"}"
        }
        # Body is passed as a single pre-formed JSON string. It must be single-
        # quoted at the call site so the POSIX shell keeps the "\\." backslashes
        # literal; nested double quotes would collapse them to "\." and RabbitMQ
        # rejects the body as not_json.
        put_permissions() {
          curl --fail --silent --show-error -u "$$auth" \
            -H "content-type: application/json" \
            -X PUT "$$api/permissions/%2F/$$1" \
            --data-raw "$$2"
        }
        put_user backend-clinical-knowledge "$${RABBITMQ_BACKEND_PASSWORD}"
        put_user backend-outbox-relay "$${RABBITMQ_BACKEND_PASSWORD}"
        put_user transcription-worker "$${RABBITMQ_WORKER_PASSWORD}"
        # Consumers declare the shared exchange (configure) and bind their queue to
        # it (write on queue + read on exchange), so both need the exchange in their
        # configure and read scopes in addition to their own queue namespace.
        # They also need write on the default exchange (amq.default): the main queue
        # is declared with x-dead-letter-exchange="" (RabbitMQ validates write on the
        # DLX at declare time), and failed messages are re-published to the retry/dlq
        # queues by name through the default exchange.
        put_permissions backend-clinical-knowledge '{"configure":"^medicalassistant\\.events$$|^medicalassistant\\.backend\\.transcript-ready(\\.retry\\.[0-9]+|\\.dlq)?$$","write":"^amq\\.default$$|^medicalassistant\\.events$$|^medicalassistant\\.backend\\.transcript-ready(\\.retry\\.[0-9]+|\\.dlq)?$$","read":"^medicalassistant\\.events$$|^medicalassistant\\.backend\\.transcript-ready(\\.retry\\.[0-9]+|\\.dlq)?$$"}'
        put_permissions backend-outbox-relay '{"configure":"^$$","write":"^medicalassistant\\.events$$","read":"^$$"}'
        put_permissions transcription-worker '{"configure":"^medicalassistant\\.events$$|^medicalassistant\\.transcription-worker(\\.retry\\.[0-9]+|\\.dlq)?$$","write":"^amq\\.default$$|^medicalassistant\\.events$$|^medicalassistant\\.transcription-worker(\\.retry\\.[0-9]+|\\.dlq)?$$","read":"^medicalassistant\\.events$$|^medicalassistant\\.transcription-worker(\\.retry\\.[0-9]+|\\.dlq)?$$"}'
        # consultation.transcription-failed.v1 is emitted but has no subscriber, so
        # the outbox relay's mandatory publish returns unroutable and retries forever.
        # Give it a durable, bounded audit queue (visible in the management UI) so the
        # publish routes to a real destination. Idempotent and matches the direct,
        # durable exchange the consumers declare.
        curl --fail --silent --show-error -u "$$auth" -H "content-type: application/json" \
          -X PUT "$$api/exchanges/%2F/medicalassistant.events" \
          --data-raw '{"type":"direct","durable":true}'
        curl --fail --silent --show-error -u "$$auth" -H "content-type: application/json" \
          -X PUT "$$api/queues/%2F/medicalassistant.transcription-failed" \
          --data-raw '{"durable":true,"arguments":{"x-max-length":10000,"x-overflow":"drop-head"}}'
        curl --fail --silent --show-error -u "$$auth" -H "content-type: application/json" \
          -X POST "$$api/bindings/%2F/e/medicalassistant.events/q/medicalassistant.transcription-failed" \
          --data-raw '{"routing_key":"consultation.transcription-failed.v1"}'

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    # skipApiVersionCheck: the Azure Storage .NET SDK (12.23) sends a newer
    # x-ms-version than older Azurite builds accept, which surfaced as a shared-key
    # AuthorizationFailure on container create. loose relaxes header validation for
    # local dev.
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --loose
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - medicalassistant_azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-migrations:
    build:
      context: .
      dockerfile: backend/src/MedicalAssistant.Migrations/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: PostgreSQL
      ConnectionStrings__MedicalAssistantDatabasePostgreSQL: Host=postgres-app;Port=5432;Database=MedicalAssistantDb;Username=medicalassistant;Password=${POSTGRES_APP_PASSWORD:-medicalassistant-local}
    depends_on:
      postgres-app:
        condition: service_healthy
    restart: "no"

  clinical-knowledge:
    build:
      context: .
      dockerfile: AI/src/MedicalAssistance.Ingestion.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres-clinical;Port=5432;Database=ai_med;Username=clinicalknowledge;Password=${POSTGRES_CLINICAL_PASSWORD:-clinicalknowledge-local};Maximum Pool Size=50
      Authentication__ApiKeys__0: ${CLINICAL_KNOWLEDGE_API_KEY:-local-development-key}
      Authentication__AdminApiKeys__0: ${CLINICAL_KNOWLEDGE_ADMIN_API_KEY:-local-development-admin-key}
      # OpenAI for chunking/summaries (chat) and embeddings. Each section activates
      # only when its ApiKey is present. Embeddings MUST be text-embedding-3-large
      # (3072 dims) to match the fixed vector(3072) column.
      OpenAIChat__ApiKey: ${OPENAI_API_KEY:-}
      OpenAIChat__Model: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      OpenAIEmbeddings__ApiKey: ${OPENAI_API_KEY:-}
      OpenAIEmbeddings__Model: ${OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-large}
    ports:
      - "8000:8080"
    depends_on:
      postgres-clinical:
        condition: service_healthy

  backend-api:
    build:
      context: .
      dockerfile: backend/src/MedicalAssistant.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSQL
      ConnectionStrings__MedicalAssistantDatabasePostgreSQL: Host=postgres-app;Port=5432;Database=MedicalAssistantDb;Username=medicalassistant;Password=${POSTGRES_APP_PASSWORD:-medicalassistant-local}
      JwtSettings__Key: ${JWT_KEY:-MedicalAssistantLocalDevelopmentJwtKey_ChangeMe_32chars}
      JwtSettings__Issuer: MedicalAssistantApi
      JwtSettings__Audience: MedicalAssistantClient
      # Allow the local Vite dev server origin (frontend runs outside Compose).
      CorsSettings__AllowedOrigins__0: http://localhost:5173
      CorsSettings__AllowedOrigins__1: http://localhost:4200
      CorsSettings__AllowedOrigins__2: http://localhost:5500
      BlobStorage__ConnectionString: ${AZURITE_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}
      BlobStorage__ConsultationAudioContainer: audio
      BlobStorage__ConsultationDocumentsContainer: pdf
      ClinicalKnowledge__BaseUrl: http://clinical-knowledge:8080
      ClinicalKnowledge__ApiKey: ${CLINICAL_KNOWLEDGE_API_KEY:-local-development-key}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: backend-clinical-knowledge
      RabbitMQ__Password: ${RABBITMQ_BACKEND_PASSWORD:-backend-rabbitmq-local}
      RabbitMQ__ClientProvidedName: backend-clinical-knowledge
      RabbitMQ__Consumer__QueueName: medicalassistant.backend.transcript-ready
      RabbitMQ__Topology__SubscriberName: backend-clinical-knowledge
      RabbitMQ__Topology__QueueName: medicalassistant.backend.transcript-ready
      ConsultationOutboxRelay__BatchSize: ${BACKEND_OUTBOX_RELAY_BATCH_SIZE:-25}
      ConsultationOutboxRelay__LeaseDuration: ${BACKEND_OUTBOX_RELAY_LEASE_DURATION:-00:02:00}
      ConsultationOutboxRelay__PollInterval: ${BACKEND_OUTBOX_RELAY_POLL_INTERVAL:-00:00:05}
      ConsultationOutboxRelay__FailureBackoff: ${BACKEND_OUTBOX_RELAY_FAILURE_BACKOFF:-00:00:30}
    ports:
      - "7037:8080"
    depends_on:
      postgres-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-provisioner:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
      clinical-knowledge:
        condition: service_healthy
      backend-migrations:
        condition: service_completed_successfully

  transcription-worker:
    build:
      context: .
      dockerfile: backend/src/MedicalAssistant.Transcription.Worker/Dockerfile
    environment:
      Database__Provider: PostgreSQL
      ConnectionStrings__MedicalAssistantDatabasePostgreSQL: Host=postgres-app;Port=5432;Database=MedicalAssistantDb;Username=medicalassistant;Password=${POSTGRES_APP_PASSWORD:-medicalassistant-local}
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: transcription-worker
      RabbitMQ__Password: ${RABBITMQ_WORKER_PASSWORD:-worker-rabbitmq-local}
      RabbitMQ__ClientProvidedName: transcription-worker
      RabbitMQ__Consumer__QueueName: medicalassistant.transcription-worker
      RabbitMQ__Topology__SubscriberName: transcription-worker
      RabbitMQ__Topology__QueueName: medicalassistant.transcription-worker
      TranscriptionWorker__MaxConcurrentTranscriptions: ${TRANSCRIPTION_WORKER_MAX_CONCURRENT_TRANSCRIPTIONS:-1}
      TranscriptionWorker__ShutdownDrainTimeout: ${TRANSCRIPTION_WORKER_SHUTDOWN_DRAIN_TIMEOUT:-00:00:30}
      TranscriptionWorker__ProcessingLeaseDuration: ${TRANSCRIPTION_WORKER_PROCESSING_LEASE_DURATION:-00:10:00}
      TranscriptionWorker__BlobRetrieval__ConnectionString: ${AZURITE_CONNECTION_STRING:-UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://azurite}
      TranscriptionWorker__BlobRetrieval__ConsultationAudioContainer: audio
      # Speech-to-text provider: AzureSpeech (default) or OpenAiWhisper.
      TranscriptionWorker__Provider: ${TRANSCRIPTION_PROVIDER:-AzureSpeech}
      TranscriptionWorker__AzureSpeech__Key: ${AZURE_SPEECH_KEY:-}
      TranscriptionWorker__AzureSpeech__Region: ${AZURE_SPEECH_REGION:-}
      TranscriptionWorker__OpenAiWhisper__ApiKey: ${OPENAI_WHISPER_API_KEY:-}
      TranscriptionWorker__OpenAiWhisper__Model: ${OPENAI_WHISPER_MODEL:-gpt-4o-transcribe}
      TranscriptionWorker__OpenAiWhisper__BaseUrl: ${OPENAI_WHISPER_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rabbitmq-provisioner:
        condition: service_completed_successfully
      azurite:
        condition: service_healthy
      backend-migrations:
        condition: service_completed_successfully

volumes:
  medicalassistant_app_pgdata:
  medicalassistant_clinical_pgdata:
  medicalassistant_rabbitmq_data:
  medicalassistant_azurite_data:
