# RabbitMQ server settings for local development.
# Docs: https://www.rabbitmq.com/docs/configure

loopback_users.guest = false

# Raise default connection limits slightly for local multi-service use.
connection_max = 256
channel_max = 2047

# Heartbeats help detect dead connections from .NET clients.
heartbeat = 60

# Management plugin listens on all interfaces inside the container.
management.tcp.port = 15672
